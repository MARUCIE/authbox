services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_box
      POSTGRES_USER: auth_box
      POSTGRES_PASSWORD: auth_box_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  api:
    build:
      context: ./services/api
    environment:
      AUTH_BOX_HTTP_ADDR: ":8080"
      AUTH_BOX_DB_DSN: "postgres://auth_box:auth_box_dev@postgres:5432/auth_box?sslmode=disable"
      AUTH_BOX_REDIS_URL: "redis://redis:6379/0"
      AUTH_BOX_ENV: "local"
      AUTH_BOX_VERSION: "0.1.0"
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - redis

  console:
    build:
      context: ./apps/console
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8081"
    ports:
      - "3000"
    depends_on:
      - api

volumes:
  postgres_data:
