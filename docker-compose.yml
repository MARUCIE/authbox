services:
  postgres:
    image: postgres:16
    container_name: 10-auth-box-postgres
    environment:
      POSTGRES_DB: auth_box
      POSTGRES_USER: auth_box
      POSTGRES_PASSWORD: auth_box_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5410:5432"

  redis:
    image: redis:7
    container_name: 10-auth-box-redis
    ports:
      - "6310:6379"

  api:
    build:
      context: ./services/api
    container_name: 10-auth-box-api
    environment:
      AUTH_BOX_HTTP_ADDR: ":8080"
      AUTH_BOX_DB_DSN: "postgres://auth_box:auth_box_dev@postgres:5432/auth_box?sslmode=disable"
      AUTH_BOX_REDIS_URL: "redis://redis:6379/0"
      AUTH_BOX_ENV: "local"
      AUTH_BOX_VERSION: "0.1.0"
      AUTH_BOX_AUTH_TOKENS: "local-admin-token:actor-platform-admin:platform_admin|security_ops|compliance_auditor|policy_admin,local-security-token:actor-security-ops:security_ops,local-auditor-token:actor-compliance-auditor:compliance_auditor"
    ports:
      - "4010:8080"
    depends_on:
      - postgres
      - redis

  console:
    build:
      context: ./apps/console
    container_name: 10-auth-box-console
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4010"
      AUTH_BOX_CONSOLE_API_TOKEN: "local-admin-token"
      AUTH_BOX_CONSOLE_AUTH_SOURCE: "console"
    ports:
      - "3010:3000"
    depends_on:
      - api

volumes:
  postgres_data:
