name: authbox-vps

services:
  postgres:
    image: postgres:16-alpine
    container_name: authbox-vps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_box
      POSTGRES_USER: auth_box
      POSTGRES_PASSWORD: "${AUTH_BOX_POSTGRES_PASSWORD:?Set AUTH_BOX_POSTGRES_PASSWORD for VPS PostgreSQL}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5410:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_box"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  api:
    build:
      context: ./services/api
    container_name: authbox-vps-api
    restart: unless-stopped
    environment:
      AUTH_BOX_HTTP_ADDR: ":8080"
      AUTH_BOX_DB_DSN: "${AUTH_BOX_DB_DSN:?Set AUTH_BOX_DB_DSN for VPS API}"
      AUTH_BOX_ENV: "production"
      AUTH_BOX_VERSION: "${AUTH_BOX_VERSION:-2.0.0}"
      AUTH_BOX_ALLOWED_ORIGINS: "${AUTH_BOX_ALLOWED_ORIGINS:-https://authbox.io,https://www.authbox.io}"
      AUTH_BOX_SESSION_TTL_HOURS: "${AUTH_BOX_SESSION_TTL_HOURS:-168}"
      AUTH_BOX_AUTH_RATE_LIMIT: "${AUTH_BOX_AUTH_RATE_LIMIT:-5}"
      AUTH_BOX_TOTP_SECRET_KEY: "${AUTH_BOX_TOTP_SECRET_KEY:?Set AUTH_BOX_TOTP_SECRET_KEY as base64 32-byte key}"
    ports:
      - "127.0.0.1:4010:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
