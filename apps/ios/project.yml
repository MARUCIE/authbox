name: AuthBox
options:
  bundleIdPrefix: com.authbox
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  AuthBoxCrypto:
    path: AuthBoxCrypto

targets:
  AuthBox:
    type: application
    platform: iOS
    sources:
      - AuthBox/Sources
      - path: AuthBox/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: AuthBoxCrypto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "Auth Box"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your vault with Face ID"
        PRODUCT_BUNDLE_IDENTIFIER: com.authbox.app
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: AuthBox/AuthBox.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.authbox.shared
        com.apple.developer.authentication-services.autofill-credential-provider: true
        # Zero-knowledge iCloud sync (CKSyncEngine over VaultItemBlob ciphertext records).
        # Container provisioned 2026-06-03 on App ID com.authbox.app. Only ciphertext leaves
        # the device; the seed/vault-key never sync. See ICLOUD_SYNC_ARCHITECTURE.md.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.authbox.vault
        com.apple.developer.icloud-services:
          - CloudKit

  AutoFillExtension:
    type: app-extension
    platform: iOS
    sources:
      - AutoFillExtension
    dependencies:
      - package: AuthBoxCrypto
    info:
      path: AutoFillExtension/Info.plist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.authbox.app.autofill
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
    entitlements:
      path: AutoFillExtension/AutoFillExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.authbox.shared
        com.apple.developer.authentication-services.autofill-credential-provider: true

  AuthBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AuthBoxTests
    dependencies:
      - target: AuthBox
      - package: AuthBoxCrypto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.authbox.app.tests
        # Hosted unit tests: `@testable import AuthBox` needs the app as the test host.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AuthBox.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AuthBox"
        BUNDLE_LOADER: "$(TEST_HOST)"

  AuthBoxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AuthBoxUITests
    dependencies:
      - target: AuthBox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.authbox.app.uitests
        TEST_TARGET_NAME: AuthBox

# Declared here so `xcodegen generate` reproduces the shared scheme deterministically.
# Previously the scheme was a hand-committed file that every regenerate deleted, which
# orphaned the AuthBoxTests unit tests (target was never in project.yml either).
schemes:
  AuthBox:
    build:
      targets:
        AuthBox: all
    run:
      config: Debug
    test:
      config: Debug
      # Lets the StoreKit round-trip tests sync the local product catalog when run
      # from the Xcode IDE (Cmd+U). The deterministic entitlement tests don't need it;
      # the CLI runtime doesn't sync it (iOS 26.5 regression) so those tests XCTSkipIf.
      storeKitConfiguration: AuthBoxTests/Configuration.storekit
      targets:
        - AuthBoxTests
        - AuthBoxUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
