# XcodeGen manifest — canonical source for the AuthBoxMac macOS target.
# The generated AuthBoxMac.xcodeproj is a DERIVED cache (gitignored).
# Rebuild: cd apps/macos && xcodegen generate
name: AuthBoxMac
options:
  bundleIdPrefix: com.authbox
  deploymentTarget:
    macOS: "26.0"   # latest macOS (Tahoe). Dev+run+test host is 26.5; only the
                    # macOS 26.5 SDK is installed, so 26.0 is the honest floor —
                    # built/run/tested exactly on the OS it targets. Adopts macOS
                    # 26 Liquid Glass styling for standard SwiftUI controls.
                    # To broaden later (e.g. workshop distribution to <26 Macs),
                    # flip these three entries back to "15.0"/"14.0".
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AuthBoxCrypto:
    # shared, already cross-platform (iOS 17 + macOS 14)
    path: ../ios/AuthBoxCrypto

targets:
  AuthBoxMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: AuthBoxMac
    dependencies:
      - package: AuthBoxCrypto
        product: AuthBoxCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.authbox.mac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Auth Box"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        # P0 local build: ad-hoc sign + hardened runtime. Team-scoped entitlements
        # (app-group, keychain-access-groups) land in P1 with a DEVELOPMENT_TEAM.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: AuthBoxMac/Resources/AuthBoxMac.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        DEAD_CODE_STRIPPING: YES
    scheme:
      testTargets:
        - AuthBoxMacTests
      gatherCoverageData: false

  AuthBoxMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: AuthBoxMacTests
    dependencies:
      - target: AuthBoxMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.authbox.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
